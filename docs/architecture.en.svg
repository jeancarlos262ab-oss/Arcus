<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Segoe UI, Roboto, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#555"/>
    </marker>
  </defs>

  <rect width="1200" height="640" fill="#ffffff"/>

  <!-- Ingress -->
  <rect x="440" y="20" width="320" height="50" rx="8" fill="#1f2328" stroke="#1f2328"/>
  <text x="600" y="50" text-anchor="middle" fill="#ffffff" font-size="13">GitHub &#8212; Pull Request (opened / synchronize)</text>
  <line x1="600" y1="70" x2="600" y2="92" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="500" y="94" width="200" height="48" rx="8" fill="#EAF2FD" stroke="#2E7DD1" stroke-width="1.5"/>
  <text x="600" y="123" text-anchor="middle" fill="#173A5E" font-size="13">API Gateway (HTTP API)</text>
  <line x1="600" y1="142" x2="600" y2="166" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="455" y="168" width="290" height="64" rx="8" fill="#EAF2FD" stroke="#2E7DD1" stroke-width="1.5"/>
  <text x="600" y="193" text-anchor="middle" fill="#173A5E" font-size="13" font-weight="600">Lambda &#183; webhook_handler</text>
  <text x="600" y="213" text-anchor="middle" fill="#555" font-size="10.5">verify HMAC &#183; dedup &#183; StartExecution</text>
  <line x1="600" y1="232" x2="600" y2="262" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step Functions container -->
  <rect x="40" y="264" width="1120" height="150" rx="12" fill="#FBF4FE" stroke="#8E44AD" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="60" y="286" fill="#6C3483" font-size="12" font-weight="600">AWS Step Functions (Standard) &#183; PR review pipeline</text>

  <!-- Agent boxes -->
  <g fill="#ffffff" stroke="#8E44AD" stroke-width="1.5">
    <rect x="55" y="312" width="165" height="72" rx="8"/>
    <rect x="240" y="312" width="165" height="72" rx="8"/>
    <rect x="425" y="312" width="165" height="72" rx="8"/>
    <rect x="610" y="312" width="165" height="72" rx="8"/>
    <rect x="795" y="312" width="165" height="72" rx="8"/>
    <rect x="980" y="312" width="165" height="72" rx="8"/>
  </g>
  <g fill="#4A235A" font-size="13" text-anchor="middle">
    <text x="137" y="353">FetchPR</text>
    <text x="322" y="346">Context</text><text x="322" y="364">Builder</text>
    <text x="507" y="346">Consistency</text><text x="507" y="364">Checker</text>
    <text x="692" y="346">Bug</text><text x="692" y="364">Hunter</text>
    <text x="877" y="346">Fix</text><text x="877" y="364">Suggester</text>
    <text x="1062" y="353">Reporter</text>
  </g>
  <g stroke="#555" stroke-width="1.5">
    <line x1="222" y1="348" x2="236" y2="348" marker-end="url(#arrow)"/>
    <line x1="407" y1="348" x2="421" y2="348" marker-end="url(#arrow)"/>
    <line x1="592" y1="348" x2="606" y2="348" marker-end="url(#arrow)"/>
    <line x1="777" y1="348" x2="791" y2="348" marker-end="url(#arrow)"/>
    <line x1="962" y1="348" x2="976" y2="348" marker-end="url(#arrow)"/>
  </g>

  <!-- Services connectors -->
  <g stroke="#B7791F" stroke-width="1.2" stroke-dasharray="4 4">
    <line x1="210" y1="414" x2="210" y2="452"/>
    <line x1="470" y1="414" x2="470" y2="452"/>
    <line x1="730" y1="414" x2="730" y2="452"/>
    <line x1="990" y1="414" x2="990" y2="452"/>
  </g>

  <!-- Services band -->
  <rect x="90" y="452" width="240" height="58" rx="8" fill="#FFF6EC" stroke="#E08E2B" stroke-width="1.5"/>
  <text x="210" y="477" text-anchor="middle" fill="#7A4E12" font-size="12.5" font-weight="600">Amazon S3</text>
  <text x="210" y="495" text-anchor="middle" fill="#7A4E12" font-size="10.5">graphs &#183; subgraphs &#183; diffs</text>

  <rect x="350" y="452" width="240" height="58" rx="8" fill="#EDF7EE" stroke="#3F9E4D" stroke-width="1.5"/>
  <text x="470" y="477" text-anchor="middle" fill="#22592B" font-size="12.5" font-weight="600">Amazon Bedrock</text>
  <text x="470" y="495" text-anchor="middle" fill="#22592B" font-size="10.5">Nova 2 Lite (Converse)</text>

  <rect x="610" y="452" width="240" height="58" rx="8" fill="#FFF6EC" stroke="#E08E2B" stroke-width="1.5"/>
  <text x="730" y="477" text-anchor="middle" fill="#7A4E12" font-size="12.5" font-weight="600">Amazon DynamoDB</text>
  <text x="730" y="495" text-anchor="middle" fill="#7A4E12" font-size="10.5">history &#183; dedup &#183; metrics</text>

  <rect x="870" y="452" width="240" height="58" rx="8" fill="#FFF6EC" stroke="#E08E2B" stroke-width="1.5"/>
  <text x="990" y="477" text-anchor="middle" fill="#7A4E12" font-size="12.5" font-weight="600">AWS Secrets Manager</text>
  <text x="990" y="495" text-anchor="middle" fill="#7A4E12" font-size="10.5">webhook secret &#183; GitHub App key</text>

  <!-- Outputs -->
  <line x1="600" y1="414" x2="600" y2="548" stroke="#555" stroke-width="1.5"/>
  <text x="610" y="470" fill="#555" font-size="10.5">Reporter</text>
  <line x1="600" y1="548" x2="430" y2="548" stroke="#555" stroke-width="1.5"/>
  <line x1="430" y1="548" x2="430" y2="558" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="548" x2="770" y2="548" stroke="#555" stroke-width="1.5"/>
  <line x1="770" y1="548" x2="770" y2="558" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="300" y="560" width="260" height="56" rx="8" fill="#F1F3F5" stroke="#868E96" stroke-width="1.5"/>
  <text x="430" y="593" text-anchor="middle" fill="#343A40" font-size="12.5">Dashboard (React &#183; read-only)</text>

  <rect x="640" y="560" width="260" height="56" rx="8" fill="#F1F3F5" stroke="#868E96" stroke-width="1.5"/>
  <text x="770" y="593" text-anchor="middle" fill="#343A40" font-size="12.5">PR comment (GitHub API)</text>
</svg>
