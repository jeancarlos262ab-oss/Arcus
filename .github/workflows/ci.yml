name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dashboard:
    name: Dashboard build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        run: npm ci

      - name: Build dashboard
        run: npm run build

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Sync locked environment
        run: uv sync --locked --dev

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run lint
        run: uv run ruff check .

      - name: Run strict boundary type checks
        run: uv run mypy src/arcus/contracts src/arcus/graph src/arcus/github

      - name: Run unit tests
        run: uv run pytest tests/unit

      - name: Run contract tests
        run: uv run pytest -m contract

      - name: Run integration tests
        run: uv run pytest tests/integration

      - name: Build Python distributions
        run: uv build

      - name: Validate SAM template
        run: sam validate --template-file infra/template.yaml --lint

      - name: Build SAM application
        run: sam build --template-file infra/template.yaml --beta-features
